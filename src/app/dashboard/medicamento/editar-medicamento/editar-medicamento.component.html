<div class="max-w-4xl mx-auto space-y-6">
    <div class="flex items-center gap-4">
        <a routerLink="/dashboard/medicamento"
            class="p-2 text-slate-400 hover:text-emerald-600 transition-colors bg-white rounded-xl border border-slate-200 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
        </a>
        <h1 class="text-2xl font-bold text-slate-800">Editar Medicamento</h1>
    </div>

    <form (ngSubmit)="actualizar()" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2 md:col-span-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Nombre del Medicamento</label>
                <input type="text" name="nombre" [(ngModel)]="medicamento.nombre" required
                    placeholder="Ej: Amoxicilina 500mg"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
            </div>

            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Stock Disponible</label>
                <input type="number" name="cantidadStock" [(ngModel)]="medicamento.cantidadStock" required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
            </div>

            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Precio Unitario ($)</label>
                <input type="number" name="precio" [(ngModel)]="medicamento.precio" required step="0.01"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
            </div>

            <div class="space-y-2 md:col-span-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Descripción / Uso</label>
                <textarea name="descripcion" [(ngModel)]="medicamento.descripcion" placeholder="Indicaciones breves..."
                    rows="3"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none"></textarea>
            </div>
        </div>

        <div class="flex justify-end pt-6 border-t border-slate-100 gap-4">
            <a routerLink="/dashboard/medicamento"
                class="px-8 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold transition-all">
                Cancelar
            </a>
            <button type="submit"
                class="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold transition-all shadow-lg shadow-emerald-600/20">
                Actualizar Medicamento
            </button>
        </div>
    </form>
</div>
