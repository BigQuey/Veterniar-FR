<div class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <h1 class="text-2xl font-bold text-slate-800">Inventario de Medicamentos</h1>
        <a *ngIf="esAdmin" routerLink="crear"
            class="inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl transition-all shadow-lg shadow-emerald-600/20 font-bold w-full sm:w-auto">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            Nuevo Medicamento
        </a>
    </div>

    <div *ngIf="error"
        class="bg-red-50 border border-red-200 text-red-700 px-6 py-4 rounded-2xl text-sm font-medium">
        {{ error }}
    </div>

    <div class="flex flex-col sm:flex-row gap-3 bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
        <input type="text" [(ngModel)]="term" (keyup.enter)="buscar()" placeholder="Buscar por nombre..."
            class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none text-sm">
        <button (click)="buscar()"
            class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-bold transition-all sm:w-auto">
            Buscar
        </button>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[560px]">
            <thead>
                <tr class="bg-slate-50 border-b border-slate-200">
                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-widest">Medicamento</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-widest text-center">Stock
                    </th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-widest text-center">Precio
                    </th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-widest text-right">Acciones
                    </th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <tr *ngFor="let m of medicamentos" class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4">
                        <div class="text-sm font-bold text-slate-700">{{ m.nombre }}</div>
                        <div class="text-xs text-slate-400 font-medium line-clamp-1">{{ m.descripcion }}</div>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <span [class]="'px-3 py-1 rounded-lg text-xs font-bold ' + getStockClass(m.cantidadStock)">
                            {{ m.cantidadStock }} uds
                        </span>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <div class="text-sm font-bold text-slate-700">S/.{{ m.precio | number:'1.2-2' }}</div>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <div *ngIf="esAdmin" class="flex justify-end gap-2">
                            <a [routerLink]="['editar', m.id]"
                                class="p-2 text-slate-400 hover:text-emerald-600 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                    stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                                </svg>
                            </a>
                            <button (click)="eliminarMedicamento(m.id)"
                                class="p-2 text-slate-400 hover:text-red-500 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                    stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
        <div *ngIf="medicamentos.length === 0"
            class="p-12 text-center text-slate-400 bg-slate-50/50 text-sm font-medium">
            No hay medicamentos en el inventario.
        </div>
    </div>
</div>
