<div class="max-w-4xl mx-auto space-y-6">
    <div class="flex items-center gap-4">
        <a routerLink="/dashboard/cita"
            class="p-2 text-slate-400 hover:text-emerald-600 transition-colors bg-white rounded-xl border border-slate-200 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
        </a>
        <h1 class="text-2xl font-bold text-slate-800">Programar Nueva Cita</h1>
    </div>

    <form (ngSubmit)="guardar()" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Fecha y hora -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Fecha</label>
                <input type="date" name="fecha" [(ngModel)]="cita.fecha" required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
            </div>
            <!-- Fin fecha y hora -->

            <!-- Hora -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Hora</label>
                <input type="time" name="hora" [(ngModel)]="cita.hora" required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
            </div>
            <!-- Fin hora -->

            <!-- Mascota -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Mascota</label>

                <select name="mascota" [(ngModel)]="cita.mascota!.id" (change)="onMascotaChange()" required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
                    <option [ngValue]="undefined" disabled>Selecciona una mascota</option>
                    <option *ngFor="let m of mascotas" [value]="m.id">{{ m.nombre }}</option>
                </select>
            </div>
            <!-- Fin mascota -->

            <!-- Dueño -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Dueño</label>
                <select name="dueno" [(ngModel)]="cita.dueno!.id" required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
                    <option [ngValue]="undefined" disabled>Selecciona un dueño</option>
                    <option *ngFor="let d of duenos" [value]="d.id">{{ d.nombre }}</option>
                </select>
            </div>

            <!-- Fin dueño -->

            <!-- Veterinario -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Veterinario</label>
                <select name="veterinario" [(ngModel)]="cita.veterinario!.id" required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
                    <option [ngValue]="undefined" disabled>Selecciona un veterinario</option>
                    <option *ngFor="let v of veterinarios" [value]="v.id">{{ v.username }}</option>
                </select>
            </div>
            <!-- Fin veterinario -->

            <!-- Estado -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Estado</label>
                <select name="estado" [(ngModel)]="cita.estado"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
                    <option value="PROGRAMADA">Programada</option>
                    <option value="COMPLETADA">Completada</option>
                    <option value="CANCELADA">Cancelada</option>
                </select>
            </div>
            <!-- Fin estado -->
        </div>

        <div class="space-y-2">
            <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Motivo de la Cita</label>
            <textarea name="motivo" [(ngModel)]="cita.motivo" placeholder="Ej: Control de vacunas, Cirugía, etc."
                rows="3"
                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none"></textarea>
        </div>

        <div class="flex justify-end pt-6 border-t border-slate-100 gap-4">
            <a routerLink="/dashboard/cita"
                class="px-8 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold transition-all">
                Cancelar
            </a>
            <button type="submit"
                class="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold transition-all shadow-lg shadow-emerald-600/20">
                Guardar Cita
            </button>
        </div>
    </form>
</div>
