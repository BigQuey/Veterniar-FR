<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold text-slate-800">Historial Clínico</h1>
        <a routerLink="crear"
            class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl transition-all shadow-lg shadow-emerald-600/20 font-bold flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            Nuevo Registro
        </a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let h of historiales"
            class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4 hover:shadow-md transition-shadow">
            <div class="flex justify-between items-start">
                <div class="space-y-1">
                    <div class="text-xs font-bold text-emerald-600 uppercase tracking-widest">{{ h.fecha |
                        date:'dd/MM/yyyy' }}</div>
                    <h2 class="text-lg font-bold text-slate-800">{{ h.mascota?.nombre }}</h2>
                </div>
                <div class="flex gap-2">
                    <button (click)="eliminarHistorial(h.id)"
                        class="text-slate-300 hover:text-red-500 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                            stroke="currentColor" class="w-4 h-4">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="space-y-2">
                <div class="text-xs font-bold text-slate-400 uppercase tracking-widest">Diagnóstico</div>
                <p class="text-sm text-slate-600 line-clamp-2">{{ h.diagnostico }}</p>
            </div>

            <div class="space-y-2">
                <div class="text-xs font-bold text-slate-400 uppercase tracking-widest">Tratamiento</div>
                <p class="text-sm text-emerald-700 font-medium">{{ h.tratamiento }}</p>
            </div>

            <div class="pt-4 border-t border-slate-50 flex items-center gap-2">
                <div
                    class="w-6 h-6 bg-slate-100 rounded-full flex items-center justify-center text-[10px] font-bold text-slate-500">
                    {{ h.veterinario?.username?.charAt(0)?.toUpperCase() }}
                </div>
                <span class="text-xs text-slate-400">Dr. {{ h.veterinario?.username }}</span>
            </div>
        </div>

        <div *ngIf="historiales.length === 0"
            class="col-span-full p-12 text-center text-slate-400 bg-white rounded-2xl border border-dashed border-slate-300">
            No hay registros clínicos aún.
        </div>
    </div>
</div>
