<div class="max-w-4xl mx-auto space-y-6">
    <div class="flex items-center gap-4">
        <a routerLink="/dashboard/historial-clinico"
            class="p-2 text-slate-400 hover:text-emerald-600 transition-colors bg-white rounded-xl border border-slate-200 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
        </a>
        <h1 class="text-2xl font-bold text-slate-800">Nuevo Registro Clínico</h1>
    </div>

    <div *ngIf="error"
        class="bg-red-50 border border-red-200 text-red-700 px-6 py-4 rounded-2xl text-sm font-medium">
        {{ error }}
    </div>

    <form (ngSubmit)="guardar()" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-8">
        <div class="space-y-2">
            <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Cita atendida (opcional)</label>
            <select name="cita" [(ngModel)]="citaSeleccionadaId" (change)="onCitaSeleccionada()"
                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
                <option [ngValue]="undefined">Registro directo (sin cita)</option>
                <option *ngFor="let c of citasAtendidas" [ngValue]="c.id">
                    {{ c.fecha }} {{ c.hora }} — {{ c.mascota?.nombre }} — Dr. {{ c.veterinario?.username }}
                </option>
            </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Mascota</label>
                <select name="mascota" [(ngModel)]="historial.mascotaId" required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
                    <option [ngValue]="undefined" disabled>Selecciona una mascota</option>
                    <option *ngFor="let m of mascotas" [ngValue]="m.id">{{ m.nombre }}</option>
                </select>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Veterinario
                    Responsable</label>
                <select name="veterinario" [(ngModel)]="historial.veterinarioId" required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
                    <option [ngValue]="undefined" disabled>Selecciona un veterinario</option>
                    <option *ngFor="let v of veterinarios" [ngValue]="v.id">{{ v.username }}</option>
                </select>
            </div>
        </div>

        <div class="space-y-6">
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Diagnóstico</label>
                <textarea name="diagnostico" [(ngModel)]="historial.diagnostico"
                    placeholder="Resultados del examen clínico..." rows="3" required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none"></textarea>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Tratamiento Sugerido</label>
                <textarea name="tratamiento" [(ngModel)]="historial.tratamiento"
                    placeholder="Medicamentos, dosis y duración..." rows="3"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none"></textarea>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Observaciones
                    Adicionales</label>
                <textarea name="observaciones" [(ngModel)]="historial.observaciones" placeholder="Notas internas..."
                    rows="2"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none"></textarea>
            </div>
        </div>

        <div class="flex flex-col-reverse sm:flex-row sm:justify-end pt-6 border-t border-slate-100 gap-3">
            <a routerLink="/dashboard/historial-clinico"
                class="px-8 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold transition-all w-full sm:w-auto text-center">
                Cancelar
            </a>
            <button type="submit"
                class="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold transition-all shadow-lg shadow-emerald-600/20 w-full sm:w-auto">
                Registrar en Historial
            </button>
        </div>
    </form>
</div>
