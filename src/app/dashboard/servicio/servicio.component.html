<div class="space-y-6">
  <!-- Header Section -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div class="space-y-1">
      <h1 class="text-2xl font-bold text-slate-800">Catálogo de Servicios</h1>
      <p class="text-sm text-slate-400 font-medium tracking-wide">Gestiona los servicios médicos y estéticos disponibles
      </p>
    </div>
    <a *ngIf="esAdmin" routerLink="crear"
      class="inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl transition-all shadow-lg shadow-emerald-600/20 font-bold w-full sm:w-auto">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
        class="w-5 h-5 group-hover:rotate-90 transition-transform duration-300">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      Nuevo Servicio
    </a>
  </div>

  <!-- Success Message -->
  <div *ngIf="mensajeExito"
    class="bg-emerald-50 border border-emerald-100 text-emerald-700 px-6 py-4 rounded-2xl flex items-center gap-3 animate-fade-in shadow-sm">
    <div class="w-8 h-8 bg-emerald-100 rounded-full flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
        class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
      </svg>
    </div>
    <span class="font-bold text-sm">{{ mensajeExito }}</span>
  </div>

  <!-- Grid view for Servicios -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <div *ngFor="let s of servicios"
      class="bg-white rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 group overflow-hidden flex flex-col">

      <!-- Card Image/Icon Placeholder Section -->
      <div class="h-40 bg-slate-50 relative overflow-hidden flex items-center justify-center">
        <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/5 to-transparent"></div>
        <div
          class="w-16 h-16 bg-white rounded-2xl shadow-md flex items-center justify-center z-10 text-emerald-600 group-hover:scale-110 group-hover:bg-emerald-600 group-hover:text-white transition-all duration-500">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="w-8 h-8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z" />
          </svg>
        </div>
        <div class="absolute -bottom-6 -right-6 w-24 h-24 bg-emerald-500/5 rounded-full"></div>
      </div>

      <!-- Card Content -->
      <div class="p-6 flex-grow flex flex-col items-center text-center gap-4">
        <div class="space-y-1">
          <div class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">Servicio</div>
          <h3 class="text-lg font-bold text-slate-800 leading-tight">{{ s.nombre }}</h3>
        </div>

        <div class="w-full h-px bg-slate-50"></div>

        <div class="space-y-1">
          <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest leading-none">Precio</div>
          <div class="text-2xl font-black text-emerald-600">S/ {{ s.precio | number:'1.2-2' }}</div>
        </div>

        <!-- Action Buttons -->
        <div *ngIf="esAdmin" class="flex w-full gap-2 pt-2">
          <a [routerLink]="['/dashboard/servicio/editar', s.id]"
            class="flex-1 flex items-center justify-center gap-2 py-2.5 bg-slate-50 hover:bg-emerald-50 text-slate-500 hover:text-emerald-700 rounded-xl font-bold text-xs transition-all border border-slate-100 hover:border-emerald-100">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="m16.862 4.487 1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
            </svg>
            Editar
          </a>
          <button (click)="eliminar(s.id)"
            class="w-10 h-10 flex items-center justify-center bg-slate-50 hover:bg-red-50 text-slate-400 hover:text-red-500 rounded-xl transition-all border border-slate-100 hover:border-red-100">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="servicios.length === 0"
    class="bg-white rounded-[2rem] border-2 border-dashed border-slate-200 p-20 text-center space-y-4">
    <div class="w-20 h-20 bg-slate-50 rounded-3xl mx-auto flex items-center justify-center text-slate-300">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
        class="w-10 h-10">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M11.42 15.17L17.25 21A2.67 2.67 0 0021 17.25l-5.83-5.83m-4.75 4.75a4.5 4.5 0 01-6.36-6.36 4.5 4.5 0 016.36 6.36zM16.5 4.5L19.5 7.5m-3-3l3 3m1.5 5.25L15 12" />
      </svg>
    </div>
    <div class="space-y-1">
      <h3 class="text-xl font-bold text-slate-800">No hay servicios registrados</h3>
      <p class="text-slate-400 font-medium">Comienza definiendo los servicios que ofrece tu veterinaria.</p>
    </div>
    <button routerLink="crear" class="text-emerald-600 font-bold hover:text-emerald-700 transition-colors">
      Crear primer servicio ahora →
    </button>
  </div>
</div>
