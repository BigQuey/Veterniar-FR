<div class="max-w-4xl mx-auto space-y-6">
    <!-- Header Section -->
    <div class="flex items-center gap-4">
        <a routerLink="/dashboard/servicio"
            class="p-2 text-slate-400 hover:text-emerald-600 transition-colors bg-white rounded-xl border border-slate-200 shadow-sm group">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                stroke="currentColor" class="w-5 h-5 group-hover:-translate-x-1 transition-transform">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-slate-800">Nuevo Servicio</h1>
            <p class="text-sm text-slate-400 font-medium tracking-wide">Añade una nueva prestación al catálogo</p>
        </div>
    </div>

    <!-- Form Card -->
    <form (ngSubmit)="guardar()" class="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
        <!-- Form Body -->
        <div class="p-8 md:p-12 space-y-10">

            <!-- Section: Info -->
            <div class="space-y-6">
                <div class="flex items-center gap-3">
                    <div class="w-1.5 h-6 bg-emerald-500 rounded-full"></div>
                    <h2 class="text-xs font-bold text-slate-500 uppercase tracking-[0.2em]">Detalles del Servicio</h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2 md:col-span-2">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-widest px-1">Nombre del
                            Servicio</label>
                        <input type="text" name="nombre" [(ngModel)]="servicio.nombre" required
                            placeholder="Ej: Consulta Veterinaria General"
                            class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition-all outline-none text-slate-700 font-medium">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-widest px-1">Precio
                            (S/)</label>
                        <div class="relative">
                            <span class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 font-bold">S/</span>
                            <input type="number" name="precio" [(ngModel)]="servicio.precio" required placeholder="0.00"
                                class="w-full pl-12 pr-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition-all outline-none text-slate-700 font-bold">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Decorative Info Section -->
            <div class="p-6 bg-slate-50 rounded-2xl flex items-start gap-4">
                <div
                    class="w-10 h-10 bg-emerald-100 rounded-xl flex items-center justify-center text-emerald-600 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                    </svg>
                </div>
                <div class="space-y-1">
                    <p class="text-sm font-bold text-slate-700">Recuerda...</p>
                    <p class="text-xs text-slate-500 leading-relaxed font-medium">Los servicios agregados aquí estarán
                        disponibles inmediatamente para su selección al momento de generar nuevas facturas.</p>
                </div>
            </div>
        </div>

        <!-- Form Footer -->
        <div class="p-8 bg-slate-50 border-t border-slate-100 flex flex-col-reverse sm:flex-row sm:justify-end gap-3">
            <a routerLink="/dashboard/servicio"
                class="px-8 py-3.5 bg-white hover:bg-slate-100 text-slate-600 rounded-2xl font-bold transition-all border border-slate-200 w-full sm:w-auto text-center">
                Cancelar
            </a>
            <button type="submit"
                class="px-10 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-bold transition-all shadow-lg shadow-emerald-600/20 active:scale-95 w-full sm:w-auto">
                Guardar Servicio
            </button>
        </div>
    </form>
</div>
