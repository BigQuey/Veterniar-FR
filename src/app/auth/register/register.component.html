<div class="min-h-screen w-full flex items-center justify-center bg-cover bg-center bg-no-repeat relative px-4"
    style="background-image: url('login-bg.png');">

    <div class="absolute inset-0 bg-black/30 backdrop-blur-[2px]"></div>

    <div class="relative w-full max-w-md my-8">
        <!--Glassmorphism -->
        <div
            class="backdrop-blur-xl bg-white/20 border border-white/30 rounded-3xl shadow-2xl overflow-hidden p-8 sm:p-12 transition-all duration-500 hover:shadow-green-500/10">

            <!-- Cabecera -->
            <div class="text-center mb-8">
                <div
                    class="inline-flex items-center justify-center w-20 h-20 bg-white/40 rounded-2xl mb-4 backdrop-blur-lg border border-white/30 shadow-inner group">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor"
                        class="w-10 h-10 text-white transition-transform duration-500 group-hover:rotate-12">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M19 7.5v9m-1.25-6L19 12l1.25-1.5M15.182 15.182a4.5 4.5 0 0 1-6.364 0M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM9.75 9.75c0 .414-.168.75-.375.75S9 10.164 9 9.75 9.168 9 9.375 9s.375.336.375.75Zm-.375 0h.008v.015h-.008V9.75Zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75Zm-.375 0h.008v.015h-.008V9.75Z" />
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-white tracking-tight drop-shadow-md">Crear Cuenta</h1>
                <p class="text-white/80 mt-2 font-medium">Únete a nuestra familia veterinaria</p>
            </div>

            <!-- Mensaje de error -->
            <div *ngIf="error"
                class="mb-6 p-4 bg-red-500/20 border border-red-500/30 rounded-xl text-red-100 text-sm text-center backdrop-blur-md animate-pulse">
                {{ error }}
            </div>

            <form (ngSubmit)="onSubmit()" class="space-y-5">
                <!-- Username -->
                <div class="relative group">
                    <div
                        class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors duration-300 group-focus-within:text-green-400 text-white/70">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                        </svg>
                    </div>
                    <input type="text" placeholder="Apodo de usuario" [(ngModel)]="usuario.username" name="username"
                        required
                        class="block w-full pl-12 pr-4 py-4 bg-white/10 border border-white/20 rounded-2xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-white/40 focus:bg-white/20 transition-all duration-300">
                </div>

                <!-- Password -->
                <div class="relative group">
                    <div
                        class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors duration-300 group-focus-within:text-green-400 text-white/70">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                        </svg>
                    </div>
                    <input type="password" placeholder="Contraseña segura" [(ngModel)]="usuario.password"
                        name="password" required
                        class="block w-full pl-12 pr-4 py-4 bg-white/10 border border-white/20 rounded-2xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-white/40 focus:bg-white/20 transition-all duration-300">
                </div>

                <!-- Confirm Password -->
                <div class="relative group">
                    <div
                        class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors duration-300 group-focus-within:text-green-400 text-white/70">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751A11.956 11.956 0 0 1 12 2.714Z" />
                        </svg>
                    </div>
                    <input type="password" placeholder="Confirmar contraseña" [(ngModel)]="confirmPassword"
                        name="confirmPassword" required
                        class="block w-full pl-12 pr-4 py-4 bg-white/10 border border-white/20 rounded-2xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-white/40 focus:bg-white/20 transition-all duration-300">
                </div>

                <button type="submit" [disabled]="loading"
                    class="w-full py-4 bg-gradient-to-r from-emerald-500 to-green-600 text-white font-bold rounded-2xl shadow-xl shadow-green-500/20 hover:shadow-green-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed mt-4">
                    <span *ngIf="!loading">Registrarse</span>
                    <span *ngIf="loading" class="flex items-center justify-center">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg"
                            fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        Procesando...
                    </span>
                </button>

                <div class="text-center mt-6">
                    <p class="text-white/60 text-sm">
                        ¿Ya tienes una cuenta?
                        <a routerLink="/login"
                            class="text-white font-bold hover:text-green-400 transition-colors ml-1">Inicia sesión</a>
                    </p>
                </div>
            </form>
        </div>

        <p class="text-center text-white/50 mt-8 text-xs font-light">
            &copy; 2026 Solo Peludos. Cuidando cada ladrido y miau.
        </p>
    </div>
</div>
